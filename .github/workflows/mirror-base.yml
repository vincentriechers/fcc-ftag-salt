name: Mirror Salt base

# The image build pulls its base on every run - BuildKit has to materialise the
# base filesystem to RUN on top of it, so no amount of cache-from avoids that.
# Mirroring the CERN base into GHCR makes that pull come from the same registry
# the runner pushes to, which also lets the push blob-mount the unchanged base
# layers instead of re-uploading ~9 GB.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: Source image to mirror
        default: gitlab-registry.cern.ch/aft/algorithms/salt:latest

env:
  SOURCE: ${{ inputs.source || 'gitlab-registry.cern.ch/aft/algorithms/salt:latest' }}
  TARGET: ghcr.io/${{ github.repository_owner }}/salt-base

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools copies registry to registry without unpacking locally, so
      # this needs no disk headroom. The CERN source is anonymously pullable.
      - name: Copy to GHCR
        run: |
          DATE=$(date -u +%Y%m%d)
          docker buildx imagetools create \
            --tag "${TARGET}:latest" \
            --tag "${TARGET}:${DATE}" \
            "${SOURCE}"
          docker buildx imagetools inspect "${TARGET}:latest" --format '{{json .Manifest}}' \
            | head -c 400
