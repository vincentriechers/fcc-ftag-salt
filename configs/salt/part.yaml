name: FCC_higgs_decay_7class_part

# Particle Transformer (arXiv:2202.03772) on the same inputs and data as
# gn3.yaml: pairwise interaction features biasing the attention logits
# (EdgeAttention), non-gated FFN, class-attention pooling. No talking-heads, no
# LayerScale, no stochastic depth, no post-softmax gate.
#
# Jet classification is the only head, as in the published recipe. loss_mode
# stays GLS because with a single task the geometric mean IS that task's loss,
# so the setting is inert rather than wrong.
#
# One deviation from salt's own ParT template: dense_kwargs.hidden_dim is 4x
# embed_dim as in the paper, where salt defaults to 2x -- that difference alone
# is ~0.4 M parameters.
#
# Expects a UPP preprocessing whose out_dir matches the paths under data: and
# whose norm_dict covers every variable listed there -- InputNorm refuses to
# start otherwise, which is the intended early failure.
#
# flavour_label order: u=0 d=1 s=2 c=3 b=4 g=5 tau=6.
#

model:
  # clamp bounds the NORMALISED inputs, equivalent to clipping the stored
  # values to mean +- 5*std but without rewriting the preprocessed H5 in place.
  # It also sits in the right spot: the edge constructor runs before InputNorm,
  # and InputNorm skips "_edge_features_*", so dR/kt/z are built from raw
  # values.
  norm_config:
    clamp: 5

  optimizer: AdamW
  loss_mode: GLS
  lrs_config:
    initial: 2e-8
    # eta*(b, T) = eta_base * (b/b_ref)^0.43 * (T_ref/T)^0.10. The effective
    # batch (1000 x accum 2 = 2000) is the reference per-GPU batch, so that
    # factor is already in the reference max of 1e-4 and only the dataset-size
    # term remains: (2e7/7e7)^0.10 = 0.882 -> 8.8e-5. end/max keeps the
    # reference ratio 1/50.
    max: 8.8e-5
    end: 8.8e-7
    pct_start: 0.01
    weight_decay: 1e-5

  model:
    class_path: salt.models.SaltModel
    init_args:

      init_nets:
        - input_name: pfcand
          dense_config:
            output_size: &embed_dim 128
            hidden_layers: [256]
            activation: &activation GELU

      # Particle Interaction, part 2 of 4
      edge_init_nets:
        - input_name: pfcand
          dense_config:
            output_size: &edge_embed_dim 32
            hidden_layers: [32]
            activation: *activation

      encoder:
        class_path: salt.models.Transformer
        init_args:
          num_layers: 8
          embed_dim: *embed_dim
          # Particle Interaction, part 3 of 4
          edge_embed_dim: *edge_embed_dim
          update_edges: true
          out_dim: &out_dim 128
          # NO attn_type: EdgeAttention is raw-attention only, and leaving
          # flash-varlen set here would pack the sequence and break the forward
          # pass (see salt/models/transformer.py).
          norm: LayerNorm
          # keep one register as a NaN-guard for empty jets but drop it before
          # pooling (faithful ParT: the class-attention head sees only real
          # constituents)
          num_registers: 1
          drop_registers: true
          dense_kwargs:
            activation: *activation
            # standard 2-layer FFN, no gating
            gated: false
            # DEVIATION from salt's ParT.yaml, which leaves hidden_dim at salt's
            # default of 2 * embed_dim. The published ParT uses a 4x expansion,
            # and that difference is the whole gap between salt's template
            # (~1.7 M here) and the published ~2.1 M.
            hidden_dim: 512
          attn_kwargs:
            num_heads: 8
            # Particle Interaction, part 4 of 4. Faithful ParT: interaction bias
            # only -- no talking-heads, no post-softmax gate.
            talking_heads: false
            edge_gate: false

      # class-attention pooling: a learned class token cross-attends to the
      # constituents
      pool_net:
        class_path: salt.models.ClassAttentionPooling
        init_args:
          input_size: *out_dim
          num_layers: 2
          ls_init: null  # faithful ParT: no LayerScale (added only in DeParT)
          dense_kwargs:
            activation: *activation
            gated: false
            hidden_dim: 512
          attn_kwargs:
            num_heads: 8

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            # The ONLY head. The published ParT (arXiv:2202.03772) and the FCC
            # reference ParT both train jet classification alone -- the latter's
            # preprocess.json lists exactly the seven recojet_is* outputs and
            # nothing else. Dropping the four auxiliary heads is what makes this
            # config a reproduction of that recipe rather than a GN3-style
            # multi-task model.
            #
            # loss_mode stays GLS for a minimal diff against part_fccfull: with a
            # single task the geometric mean is that task's loss, so GLS and wsum
            # are identical here and the two configs differ ONLY in the task set.
            - class_path: salt.models.ClassificationTask
              init_args:
                name: jets_classification
                input_name: jets
                label: flavour_label
                # NOTE: use_class_dict=True breaks a --ckpt_path resume (salt
                # requires weights pre-resolved then) -- if resuming, pass the
                # AUTO-RESOLVED logs/<run>/config.yaml instead of this file.
                use_class_dict: True
                loss: torch.nn.CrossEntropyLoss
                dense_config:
                  # pool_net out (128) + 4 jet globals (pt/eta/e/mass) = 132
                  input_size: 132
                  output_size: 7
                  hidden_layers: [128, 64, 32]
                  activation: *activation

data:
  input_map:
    global: jets
    jets: jets
    pfcand: pfcand
  selections: null
  non_finite_to_num: True
  variables:
    global:
      - jet_pt
      - jet_eta
      - jet_e
      - jet_mass
    jets:
      - jet_pt
      - jet_eta
      - jet_e
      - jet_mass
    pfcand:
      - pfcand_erel_log
      - pfcand_thetarel
      - pfcand_phirel
      - pfcand_dptdpt
      - pfcand_detadeta
      - pfcand_dphidphi
      - pfcand_dxydxy
      - pfcand_dzdz
      - pfcand_dxydz
      - pfcand_dphidxy
      - pfcand_dlambdadz
      - pfcand_dxyc
      - pfcand_dxyctgtheta
      - pfcand_phic
      - pfcand_phidz
      - pfcand_phictgtheta
      - pfcand_cdz
      - pfcand_cctgtheta
      - pfcand_mtof
      - pfcand_dndx
      - pfcand_charge
      - pfcand_isMu
      - pfcand_isEl
      - pfcand_isChargedHad
      - pfcand_isGamma
      - pfcand_isNeutralHad
      - pfcand_dxy
      - pfcand_dz
      - pfcand_btagSip2dVal
      - pfcand_btagSip2dSig
      - pfcand_btagSip3dVal
      - pfcand_btagSip3dSig
      - pfcand_btagJetDistVal
      - pfcand_btagJetDistSig
      - pfcand_type
      - pfcand_e
      - pfcand_deta
      - pfcand_dphi
  # Particle Interaction, part 1 of 4. salt reads these by POSITION in
  # variables.pfcand above, on the RAW pre-normalisation tensor -- reorder that
  # list and these indices MUST follow. deta/dphi are the jet-relative CARTESIAN
  # angles the converter derives; thetarel/phirel are polar and cannot serve
  # here. dR is therefore the usual eta-phi dR, not the opening angle.
  # The "pt" slot holds the ENERGY, making kt/z the Durham variables: a momentum
  # magnitude alongside E would be the Delphes generator mass, i.e. truth
  # hadron ID. Never put one here.
  edge_constructors:
    - input_name: pfcand
      edge_features: [dR, kt, z, isSelfLoop]
      indices_map: {pt: 35, deta: 36, dphi: 37}

  # UPP writes the merged splits into train/ val/ test/ subdirs of out/.
  train_file: /data/higgs_decay/preprocessed/out/train/pp_output_train_split_*.h5
  train_vds_path: /data/higgs_decay/preprocessed/out/train/vds/pp_output_train_vds.h5
  val_file: /data/higgs_decay/preprocessed/out/val/pp_output_val_split_*.h5
  val_vds_path: /data/higgs_decay/preprocessed/out/val/vds/pp_output_val_vds.h5
  test_file: /data/higgs_decay/preprocessed/out/test/pp_output_test_split_*.h5
  test_vds_path: /data/higgs_decay/preprocessed/out/test/vds/pp_output_test_vds.h5
  norm_dict: /data/higgs_decay/preprocessed/out/norm_dict.yaml
  class_dict: /data/higgs_decay/preprocessed/out/class_dict.yaml

  # 1000 x accumulate_grad_batches 2 gives an effective batch of 2000, which is
  # what the learning rate above is derived for. Measured on this dataset:
  # 500 -> 1000 buys 1.70x throughput, 1000 -> 2000 only 8% for double the
  # memory, and a config with edge features will not fit at 2000 on a 24 GB
  # card.
  batch_size: 1000
  num_workers: 10
  persistent_workers: True
  prefetch_factor: 2

trainer:
  # max_epochs feeds OneCycle's total_steps as well as the stopping condition,
  # so changing it changes the learning rate at every step -- and a job killed
  # before the last epoch never reaches the annealed tail. Size the wall clock
  # so the schedule finishes inside it. EdgeAttention cannot use flash-varlen,
  # which costs roughly a factor 3 in throughput against a config without edge
  # features.
  max_epochs: 10
  # effective batch 1000 x 2 = 2000 (= reference per-GPU batch)
  accumulate_grad_batches: 2
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  # a multi-task GLS loss can spike hard enough in the first epoch to produce
  # NaN weights; this is the guard
  gradient_clip_val: 1.0
