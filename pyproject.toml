[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcc-ftag-converter"
dynamic = ["version"]
description = "End-to-end jet-flavour-tagging chain for FCC-ee samples: ntuple conversion to Salt-shaped HDF5, UPP preprocessing, and Salt training and evaluation."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Vincent Riechers" },
  { name = "Alexander Froch", email = "Alexander.Froch@cern.ch" },
]
keywords = ["fcc-ee", "flavour-tagging", "edm4hep", "salt", "hdf5"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]
# Same window as salt-ml / umami-preprocessing / puma-hep, so the package can be
# installed alongside them (that is what the docker/ image does).
requires-python = ">=3.11,<3.15"
# Core: just what the EDM4hep -> H5 conversion needs (pure python, no ROOT).
dependencies = [
  "awkward>=2",
  "h5py>=3.10",
  "numpy>=1.24",
  "uproot>=5",
]

[project.urls]
Homepage = "https://github.com/vincentriechers/fcc-ftag-salt"
Issues = "https://github.com/vincentriechers/fcc-ftag-salt/issues"

[project.optional-dependencies]
# xrootd:// streaming of EOS inputs (higgs_decay + full-sample conversion).
stream = ["fsspec-xrootd>=0.5"]
# fcc-ftag-compare (matplotlib) and the puma-based plotting scripts.
plots = ["matplotlib>=3.8", "puma-hep>=0.5.3"]
# Post-UPP steps: the clip and tau-block scripts read blosc-compressed H5 and
# the UPP norm_dict yaml.
cluster = ["hdf5plugin>=5", "pyyaml>=6"]
# Just the test suite. The tests import only numpy/awkward/h5py/uproot, which
# are core dependencies, so this is all a CI matrix leg needs.
test = ["pytest>=8", "pytest-cov>=7", "pytest-randomly>=4"]
# Everything needed to develop. puma-hep is deliberately left out: it is a heavy
# dependency and only the plotting scripts need it.
dev = [
  "pytest>=8",
  "pytest-cov>=7",
  "pytest-randomly>=4",
  "coverage>=7.10",
  "mypy>=1.18",
  "pre-commit>=4.3",
  "pydoclint>=0.7.3",
  # Floor, not a range: ruff runs with preview = true, where rule behaviour can
  # move between releases, so this tracks the .pre-commit-config.yaml rev.
  "ruff>=0.16.2",
  "matplotlib>=3.8",
  "fsspec-xrootd>=0.5",
  "hdf5plugin>=5",
  "pyyaml>=6",
]

[project.scripts]
fcc-ftag-convert = "fcc_ftag_converter.cli:main"
fcc-ftag-compare = "fcc_ftag_converter.compare:main"
fcc-ftag-merge   = "fcc_ftag_converter.merge:main"
fcc-ftag-higgs-decay = "fcc_ftag_converter.fcc_higgs_decay:main"

[tool.setuptools.dynamic]
version = { attr = "fcc_ftag_converter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The converter reads this at runtime for its default --reference, so it has to
# be in the wheel, not just in a source checkout.
[tool.setuptools.package-data]
fcc_ftag_converter = ["configs/*.json"]

[tool.ruff]
line-length = 100
preview = true
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Salt's rule set, so code moving between the two repos is held to one standard.
select = ["ALL"]
ignore = [
  "COM", "D100", "D105", "D205", "D401", "EM", "FIX", "FBT",
  "S101", "S404", "S602", "PLR2004", "PLR0912", "PLR0914", "CPY001", "TRY003",
  "G004", "N802", "C901", "DTZ005", "DTZ007", "INP", "EXE002",
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204",
  "T201", "PLW1514", "PTH123", "RUF017", "PLR6301", "ISC001", "S307",
  "PT027", "NPY002", "PT009", "PLW1641", "PLR0904", "N817", "S603", "PD011",
  "S113", "TCH", "PT011", "PLR1702", "S108", "PTH207", "S607", "E203", "SIM115", "PLR0913",
  "PLR0917", "A005", "ANN401", "PLR0915", "RUF015", "PLR6104", "TD003",
  # Beyond Salt's list: both are preview rules about how ruff itself is
  # configured, not about the code, and both landed after the ruff Salt pins.
  # Taking them would rewrite the list above into rule names and every `noqa`
  # into `ruff: ignore`, i.e. diverge from Salt for no gain here.
  "RUF201", "RUF105",
  # Greek letters and × in comments are physics notation, not typos.
  "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.per-file-ignores]
# Salt excludes its tests from ruff entirely; here they are linted, minus the
# rules a unit test necessarily breaks: reaching into private names and importing
# inside a test function are how the internals get exercised.
"tests/**" = [
  "D100", "D101", "D102", "D103", "D104", "D105", "PT019",
  "PLC0415", "PLC2701", "SLF001",
]

[tool.mypy]
exclude = '^tests/.*\.py$'

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
log_cli = true
log_cli_level = "CRITICAL"
filterwarnings = ["ignore::DeprecationWarning"]
